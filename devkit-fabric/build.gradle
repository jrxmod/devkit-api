base {
    archivesName = "devkit-api"
}

jar {
    from(project(':devkit-core').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-registry').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-networking').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-networking').sourceSets.client.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-components').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-config').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-client').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-client').sourceSets.client.output) {
        exclude 'fabric.mod.json'
    }
    from(project(':devkit-datagen').sourceSets.main.output) {
        exclude 'fabric.mod.json'
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Implementation-Title': 'DevKit API',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'jrxmod'
        )
    }
}
