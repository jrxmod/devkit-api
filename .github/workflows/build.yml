name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Build and verify
        run: ./gradlew build --stacktrace --warning-mode=all
      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: devkit-api-1.21.1
          path: devkit-fabric/build/libs/devkit-api-*.jar
          if-no-files-found: error
