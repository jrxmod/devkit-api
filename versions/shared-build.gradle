allprojects {
    group = rootProject.property('maven_group')
    version = rootProject.property('mod_version')

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
    }
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    // Keep outputs from the different Minecraft builds isolated even though
    // all variants read the same module directories from the repository root.
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)

    loom {
        splitEnvironmentSourceSets()
        mods {
            "${project.name}" {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.property('minecraft_version')}"
        mappings "net.fabricmc:yarn:${rootProject.property('yarn_mappings')}:v2"
        modImplementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.property('fabric_version')}"
    }

    // A variant starts with the shared module source tree. Files in its
    // overrides directory are copied first and replace files with the same
    // relative path. An optional *.excludes file can remove a shared file when
    // it has moved between the common and client source sets.
    ['main', 'client'].each { sourceSetName ->
        def sourceSet = sourceSets.named(sourceSetName)
        def overrideRoot = rootProject.file("overrides/${project.name}/src/${sourceSetName}")

        ['java', 'resources'].each { kind ->
            def sharedDirectory = project.file("src/${sourceSetName}/${kind}")
            def overrideDirectory = new File(overrideRoot, kind)
            def exclusionsFile = new File(overrideRoot, "${kind}.excludes")
            def outputDirectory = rootProject.layout.buildDirectory.dir(
                    "generated/${project.name}/${sourceSetName}/${kind}")
            def taskName = "prepare${sourceSetName.capitalize()}${kind.capitalize()}"

            def prepareTask = tasks.register(taskName, Sync) {
                into outputDirectory
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE

                // Variant files win when they share a relative path.
                from(overrideDirectory)
                from(sharedDirectory) {
                    if (exclusionsFile.isFile()) {
                        exclusionsFile.readLines('UTF-8')
                                .collect { it.trim() }
                                .findAll { !it.isEmpty() && !it.startsWith('#') }
                                .each { exclude it }
                    }
                }
            }

            if (kind == 'java') {
                sourceSet.configure { java.setSrcDirs([outputDirectory]) }
                tasks.named(sourceSetName == 'main' ? 'compileJava' : 'compileClientJava') {
                    dependsOn prepareTask
                }
            } else {
                sourceSet.configure { resources.setSrcDirs([outputDirectory]) }
                tasks.named(sourceSetName == 'main' ? 'processResources' : 'processClientResources') {
                    dependsOn prepareTask
                }
            }
        }
    }

    processResources {
        inputs.property 'version', project.version
        inputs.property 'minecraft_version', rootProject.property('minecraft_version')
        inputs.property 'loader_version', rootProject.property('loader_version')

        filesMatching('fabric.mod.json') {
            expand version: project.version,
                   minecraft_version: rootProject.property('minecraft_version'),
                   loader_version: rootProject.property('loader_version')
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.named('sourcesJar') {
        dependsOn 'prepareMainJava', 'prepareMainResources',
                'prepareClientJava', 'prepareClientResources'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = "DevKit API - ${project.name}"
                    description = 'Modular Fabric developer library for Minecraft'
                    url = 'https://github.com/jrxmod/devkit-api'
                    licenses {
                        license {
                            name = 'Apache License 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'jrxmod'
                            name = 'jrxmod'
                            url = 'https://github.com/jrxmod'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/jrxmod/devkit-api.git'
                        developerConnection = 'scm:git:ssh://git@github.com/jrxmod/devkit-api.git'
                        url = 'https://github.com/jrxmod/devkit-api'
                    }
                }
            }
        }
    }
}

project(':devkit-registry') {
    dependencies { api project(':devkit-core') }
}

project(':devkit-networking') {
    dependencies { api project(':devkit-core') }
}

project(':devkit-components') {
    dependencies { api project(':devkit-core') }
}

project(':devkit-config') {
    dependencies {
        api project(':devkit-core')
        api project(':devkit-networking')
    }
}

project(':devkit-client') {
    dependencies {
        api project(':devkit-core')
        api project(':devkit-networking')
    }
}

project(':devkit-datagen') {
    dependencies {
        api project(':devkit-core')
        api project(':devkit-registry')
        api project(':devkit-components')
    }
}

project(':devkit-fabric') {
    dependencies {
        api project(':devkit-core')
        api project(':devkit-registry')
        api project(':devkit-networking')
        api project(':devkit-components')
        api project(':devkit-config')
        api project(':devkit-client')
        api project(':devkit-datagen')
    }
}
